# Application
spring.application.name=syllabex-backend
server.port=8080
server.servlet.context-path=/

#  MySQL Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:syllabex_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:madyhoc09}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.admin.email=adminkncet@gmail.com
app.admin.password=admin123
app.admin.name=Mady

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# jpa hiberante
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#  JWT
app.jwt.secret=${JWT_SECRET:syllabex-super-secret-jwt-key-change-in-production-min-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.temp-expiration-ms=1800000

#  Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:820139156794-kbrjcqk0mhlv4evqns1urlbur5tttg9c.apps.googleusercontent.com}

#  FastAPI RAG Engine
app.fastapi.base-url=${FASTAPI_URL:http://localhost:8000}
app.fastapi.timeout-seconds=300

#  File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Logging
logging.level.com.syllabex=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
