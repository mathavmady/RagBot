# ==========================================
# Application
# ==========================================
spring.application.name=syllabex-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# ==========================================
# MySQL Database - Railway
# ==========================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Connection Pool
# ==========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================
# Admin
# ==========================================
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:Mady}

# ==========================================
# JWT
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.jwt.temp-expiration-ms=${JWT_TEMP_EXPIRATION:1800000}

# ==========================================
# Google OAuth
# ==========================================
app.google.client-id=${GOOGLE_CLIENT_ID}

# ==========================================
# FastAPI RAG Engine
# ==========================================
app.fastapi.base-url=${FASTAPI_URL}
app.fastapi.timeout-seconds=${FASTAPI_TIMEOUT:300}

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ==========================================
# Logging
# ==========================================
logging.level.com.syllabex=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorizednex